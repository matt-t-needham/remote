; Serial IR modem for the M5Stack ATOM Lite + IR Unit. See ../README.md.
; Build/flash from av_control/ with: ./pio.sh run -t upload

[env:atom]
; Official espressif32 platform = Arduino core 2.0.x, which IRremoteESP8266
; 2.8.x supports (its ESP32 timer code predates core 3.x).
platform = espressif32@6.9.0
board = m5stack-atom
framework = arduino
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-Hades2001_M5stack_695268894B-if00-port0
monitor_port = /dev/serial/by-id/usb-Hades2001_M5stack_695268894B-if00-port0
lib_deps =
    crankyoldgit/IRremoteESP8266@2.8.6
